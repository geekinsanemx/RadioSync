[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "radiosync"
dynamic = ["version"]
description = "Master channel catalog that generates validated CHIRP images per radio model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
]

[project.scripts]
radiosync = "radiosync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.version]
path = "src/radiosync/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/radiosync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "chirp: tests that run the CHIRP worker against real driver code",
]
